<style>
:root{--bg:#f4f7fa;--cd:#fff;--tx:#1b2430;--mu:#5b6676;--pr:#0f766e;--pt:#fff;--bd:#d6dee7;--ok:#166534;--okb:#dcfce7;--no:#991b1b;--nob:#fee2e2;--sl:#ccfbf1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0e151c;--cd:#18222c;--tx:#e8eef4;--mu:#9aa7b5;--pr:#2dd4bf;--pt:#06201c;--bd:#2c3a47;--ok:#86efac;--okb:#12341f;--no:#fca5a5;--nob:#3b1717;--sl:#12342f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#0f766e,#0e7490);color:#fff;border-radius:16px;padding:28px 20px;text-align:center;margin-bottom:14px}
.hero h1{margin:6px 0;font-size:1.5rem}.hero p{margin:4px 0;opacity:.92}.big{font-size:3rem}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.92rem;color:var(--mu)}
input[type=text]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:1rem;background:var(--bg);color:var(--tx);margin:6px 0 12px}
.b{background:var(--pr);color:var(--pt);border:0;border-radius:10px;padding:11px 18px;font-size:1rem;font-weight:600;cursor:pointer}
.b.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}.b:disabled{opacity:.4;cursor:default}
.o{display:flex;gap:10px;width:100%;text-align:left;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;margin:8px 0;font:inherit;cursor:pointer}
.o.on{background:var(--sl);border-color:var(--pr)}.o.ok{background:var(--okb);border-color:var(--ok)}.o.no{background:var(--nob);border-color:var(--no)}
.l{font-weight:700;min-width:1.4em}
table{border-collapse:collapse;margin:10px 0;font-size:.92rem;width:100%}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left}th{background:var(--bg)}
.wrap{overflow-x:auto}
.tag{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:99px;background:var(--sl);color:var(--tx);margin-right:6px}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.n{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font-weight:600;cursor:pointer}
.n.d{background:var(--sl);border-color:var(--pr)}.n.cur{outline:2px solid var(--pr)}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.bs{display:flex;gap:8px;align-items:center;border-top:1px solid var(--bd);padding:10px 0}.bs span{flex:1}
.bs button{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.bs button.on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
.sc{font-size:3.4rem;font-weight:800;color:var(--pr);text-align:center;line-height:1}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.ex{background:var(--bg);border-left:4px solid var(--pr);padding:10px 12px;border-radius:6px;margin-top:10px;font-size:.95rem}
.warn{color:var(--no);font-weight:600}

var Q=[
{k:'Pencernaan',t:'pg',s:'Raka mengunyah sesuap nasi tanpa menelannya selama beberapa menit dan merasakan rasa manis yang makin kuat di mulut. Pernyataan yang menjelaskan peristiwa tersebut adalah ….',o:['Pepsin dalam ludah memecah amilum menjadi glukosa','Lipase ludah memecah amilum menjadi asam lemak','Amilase ludah memecah amilum menjadi maltosa','Tripsin dalam ludah memecah amilum menjadi maltosa','Asam klorida mengubah amilum menjadi sukrosa'],a:2,e:'Ludah mengandung enzim amilase yang memulai pencernaan kimiawi amilum menjadi maltosa (gula sederhana yang terasa manis). Pepsin dan tripsin mencerna protein, lipase mencerna lemak.'},
{k:'Pencernaan',t:'pg',s:'Permukaan dalam usus halus berlipat-lipat serta memiliki jonjot (vili) dan mikrovili. Manfaat paling tepat dari struktur tersebut adalah ….',o:['memperluas bidang kontak untuk penyerapan zat makanan','mempercepat pengosongan lambung ke usus','meningkatkan produksi empedu oleh hati','menetralkan asam yang berasal dari lambung','mencerna serat selulosa menjadi glukosa'],a:0,e:'Lipatan, vili, dan mikrovili memperluas permukaan usus halus sehingga penyerapan nutrien lebih efisien. Empedu dibuat hati, dan manusia tidak mampu mencerna selulosa.'},
{k:'Pencernaan',t:'pg',s:'Setelah kantong empedunya diangkat, seorang pasien dianjurkan membatasi makanan bersantan dan gorengan. Alasan anjuran tersebut adalah ….',o:['protein tidak dapat dipecah menjadi peptida oleh pepsin','lemak sulit diemulsikan sehingga kerja lipase kurang efisien','amilum tidak dapat dicerna menjadi maltosa','glukosa tidak dapat diserap oleh vili usus halus','pepsinogen tidak dapat diubah menjadi pepsin'],a:1,e:'Empedu (dibuat hati, disimpan di kantong empedu) mengemulsi lemak menjadi butiran kecil agar mudah dicerna lipase. Tanpa penyimpanan empedu, pencernaan lemak kurang efisien.'},
{k:'Pernapasan',t:'pg',s:'Saat menarik napas dalam keadaan tenang, perubahan yang terjadi pada otot dan rongga dada adalah ….',o:['Diafragma relaksasi, volume rongga dada bertambah, tekanan udara paru-paru naik','Diafragma berkontraksi, volume rongga dada berkurang, tekanan udara paru-paru naik','Diafragma relaksasi, volume rongga dada berkurang, tekanan udara paru-paru turun','Diafragma berkontraksi, volume rongga dada bertambah, tekanan udara paru-paru turun','Diafragma berkontraksi, volume rongga dada tetap, tekanan udara paru-paru tetap'],a:3,e:'Pada inspirasi, diafragma berkontraksi dan mendatar, volume rongga dada membesar sehingga tekanan di paru-paru lebih rendah daripada udara luar dan udara mengalir masuk.'},
{k:'Pernapasan',t:'pg',s:'Tabel berikut menunjukkan tekanan parsial gas di udara alveolus dan di darah yang tiba di kapiler alveolus.'+tb(['Lokasi','Tekanan parsial O₂ (mmHg)','Tekanan parsial CO₂ (mmHg)'],[['Udara alveolus','104','40'],['Darah masuk kapiler alveolus','40','45']])+'Berdasarkan data tersebut, arah difusi gas yang terjadi adalah ….',o:['O₂ dari darah ke alveolus; CO₂ dari alveolus ke darah','O₂ dan CO₂ keduanya dari alveolus ke darah','O₂ dari alveolus ke darah; CO₂ dari darah ke alveolus','O₂ dan CO₂ keduanya dari darah ke alveolus','O₂ dari alveolus ke darah; CO₂ tetap berada di darah'],a:2,e:'Gas berdifusi dari tekanan parsial tinggi ke rendah. O₂ (104 → 40) masuk ke darah, sedangkan CO₂ (45 → 40) keluar dari darah ke alveolus.'},
{k:'Pernapasan',t:'pg',s:'Saat kabut asap kebakaran hutan dan lahan, ISPU berada pada kategori tidak sehat. Dina, penderita asma, mengalami sesak napas dan mengi. Mekanisme utama yang menyebabkan sesak pada Dina adalah ….',o:['Dinding alveolus menebal permanen sehingga difusi gas berhenti total','Otot polos bronkiolus berkontraksi dan lendir bertambah sehingga aliran udara terhambat','Diafragma berhenti berkontraksi akibat gangguan saraf','Tekanan udara luar meningkat sehingga udara sulit masuk','Eritrosit pecah sehingga oksigen tidak dapat diangkut'],a:1,e:'Pada asma, pemicu seperti asap menyebabkan peradangan, kontraksi otot polos bronkiolus, dan lendir berlebih sehingga saluran udara menyempit dan aliran udara ke alveolus berkurang.'},
{k:'Pernapasan',t:'pg',s:'Seorang pria pingsan di garasi tertutup saat mesin motor menyala lama. Gas karbon monoksida (CO) dari knalpot berbahaya karena ….',o:['merusak silia sehingga lendir tidak dapat dikeluarkan','mengikat hemoglobin lebih kuat daripada O₂ sehingga pengangkutan O₂ menurun','melarutkan plasma sehingga volume darah berkurang','menyempitkan bronkus sehingga udara tidak masuk','menghancurkan alveolus sehingga difusi gas berhenti'],a:1,e:'CO memiliki afinitas terhadap hemoglobin jauh lebih tinggi daripada O₂, membentuk karboksihemoglobin sehingga darah membawa lebih sedikit O₂ ke jaringan.'},
{k:'Peredaran Darah',t:'pg',s:'Jalur yang dilalui darah miskin oksigen dari seluruh tubuh hingga menuju paru-paru adalah ….',o:['Vena cava → atrium kiri → ventrikel kiri → aorta','Vena pulmonalis → atrium kiri → ventrikel kiri → aorta','Aorta → atrium kanan → ventrikel kanan → vena cava','Vena cava → atrium kanan → ventrikel kanan → arteri pulmonalis','Arteri pulmonalis → atrium kanan → ventrikel kanan → paru-paru'],a:3,e:'Sirkulasi kecil: darah miskin O₂ masuk atrium kanan lewat vena cava, ke ventrikel kanan, lalu dipompa lewat arteri pulmonalis ke paru-paru.'},
{k:'Peredaran Darah',t:'pg',s:'Dinding otot ventrikel kiri jantung manusia lebih tebal daripada ventrikel kanan. Hal ini berkaitan dengan fungsinya, yaitu ….',o:['menerima darah dari vena cava dengan tekanan tinggi','memompa darah ke paru-paru yang letaknya jauh dari jantung','menampung darah miskin oksigen dalam jumlah lebih banyak','mencegah aliran balik darah karena tidak memiliki katup','memompa darah ke seluruh tubuh lewat aorta dengan tekanan besar'],a:4,e:'Ventrikel kiri memompa darah beroksigen ke seluruh tubuh (sirkulasi besar) yang hambatannya jauh lebih besar daripada sirkulasi paru, sehingga dindingnya lebih tebal.'},
{k:'Ekskresi',t:'pg',s:'Seorang pasien menjalani uji urine dan hasilnya dibandingkan dengan urine normal.'+tb(['Komponen','Urine normal','Urine pasien'],[['Glukosa','Negatif','Negatif'],['Protein','Negatif','Positif tiga (+++)'],['Sel darah merah','Negatif','Positif satu (+)']])+'Dugaan gangguan yang paling sesuai dengan data tersebut adalah ….',o:['Reabsorpsi glukosa di tubulus proksimal terganggu','Filtrasi di glomerulus terganggu sehingga protein dan sel darah lolos ke filtrat','Augmentasi di tubulus kolektivus berlangsung berlebihan','Produksi hormon ADH meningkat secara berlebihan','Penyerapan air di usus besar menurun'],a:1,e:'Protein dan sel darah merah berukuran besar sehingga normalnya tidak tersaring di glomerulus. Kehadirannya dalam urine menunjukkan kerusakan filtrasi glomerulus. Glukosa negatif, jadi reabsorpsi glukosa normal.'},
{k:'Ekskresi',t:'pg',s:'Setelah berlari 20 menit tanpa minum, Raka mengeluarkan urine sedikit berwarna kuning pekat. Mekanisme yang terjadi pada ginjal Raka adalah ….',o:['Sekresi ADH menurun sehingga ginjal menahan lebih banyak air','Laju filtrasi glomerulus naik sehingga volume urine bertambah','Sekresi ADH meningkat sehingga reabsorpsi air di tubulus bertambah','Hormon insulin meningkat sehingga air ditahan di ginjal','Pembentukan urine primer berhenti sehingga zat sisa tidak keluar'],a:2,e:'Kehilangan cairan lewat keringat menaikkan osmolaritas darah sehingga ADH dilepaskan. ADH meningkatkan reabsorpsi air di tubulus distal dan kolektivus, urine menjadi sedikit dan pekat.'},
{k:'Keterpaduan Sistem',t:'pg',s:'Sekelompok murid berlari di tempat selama 3 menit lalu mencatat data berikut.'+tb(['Murid','Napas istirahat (x/menit)','Napas setelah lari (x/menit)','Nadi istirahat (x/menit)','Nadi setelah lari (x/menit)'],[['Rina','18','32','78','124'],['Budi','16','30','74','118']])+'Simpulan yang paling tepat berdasarkan data tersebut adalah ….',o:['Jumlah alveolus bertambah setelah lari sehingga napas lebih cepat','Darah kehilangan hemoglobin akibat keringat sehingga nadi lebih cepat','Otot membutuhkan lebih banyak O₂ untuk respirasi sel sehingga napas dan nadi meningkat','Sistem pencernaan berhenti bekerja sehingga napas dan nadi naik','Peningkatan napas dan nadi tidak berkaitan dengan kebutuhan energi sel otot'],a:2,e:'Aktivitas fisik meningkatkan respirasi sel otot sehingga kebutuhan O₂ naik dan CO₂ yang dihasilkan bertambah. Napas yang lebih cepat dan nadi yang meningkat menambah suplai O₂ dan pembuangan CO₂.'},
{k:'Peredaran Darah',t:'mc',s:'Hipertensi dapat meningkatkan risiko penyakit jantung, stroke, dan gagal ginjal. Pilih semua kebiasaan yang meningkatkan risiko hipertensi! (Jawaban benar lebih dari satu)',o:['Makan ikan asin dan mi instan hampir setiap hari','Merokok karena nikotin menyempitkan pembuluh darah','Berolahraga teratur sekitar 150 menit per minggu','Mengonsumsi sayur dan buah dalam jumlah cukup','Berat badan berlebih dan jarang bergerak aktif'],a:[0,1,4],e:'Natrium berlebih menahan air sehingga volume darah naik, nikotin menyempitkan pembuluh darah, dan obesitas serta kurang gerak membebani jantung. Olahraga teratur dan sayur-buah justru membantu menjaga tekanan darah.'},
{k:'Peredaran Darah',t:'mc',s:'Pilih semua pernyataan yang benar tentang komponen darah manusia! (Jawaban benar lebih dari satu)',o:['Eritrosit dewasa tidak berinti sehingga ruang untuk hemoglobin lebih luas','Leukosit mengangkut CO₂ dalam bentuk bikarbonat','Trombosit membantu menutup luka dengan membentuk sumbat dan gumpalan','Hemoglobin terdapat di dalam plasma darah','Plasma darah mengangkut zat makanan, hormon, dan urea'],a:[0,2,4],e:'Eritrosit dewasa tanpa inti dan berisi hemoglobin; trombosit berperan dalam pembekuan; plasma mengangkut zat terlarut. Leukosit berfungsi dalam pertahanan tubuh, dan hemoglobin berada di dalam eritrosit.'},
{k:'Pencernaan',t:'mc',s:'Pilih semua pasangan organ, zat, dan fungsi pencernaan yang benar! (Jawaban benar lebih dari satu)',o:['Pankreas – tripsin – memecah protein menjadi peptida','Mulut – amilase – mencerna protein menjadi asam amino','Hati – empedu – mengemulsi lemak','Lambung – HCl – mengaktifkan pepsinogen menjadi pepsin','Usus besar – menyerap sebagian besar zat makanan'],a:[0,2,3],e:'Tripsin dari pankreas mencerna protein, empedu dari hati mengemulsi lemak, dan HCl mengaktifkan pepsinogen. Amilase mencerna amilum, bukan protein; usus besar terutama menyerap air dan mineral, sedangkan penyerapan utama terjadi di usus halus.'},
{k:'Ekskresi',t:'mc',s:'Pilih semua pernyataan yang benar tentang organ ekskresi dan pembentukan urine! (Jawaban benar lebih dari satu)',o:['Urine primer mengandung protein dalam jumlah besar','Kulit mengeluarkan air, garam, dan sedikit urea lewat keringat','Urea dikeluarkan dari tubuh terutama melalui paru-paru','Reabsorpsi glukosa terjadi di tubulus kontortus proksimal','Urine primer terbentuk di kapsul Bowman dari hasil filtrasi glomerulus'],a:[1,3,4],e:'Filtrat glomerulus (urine primer) tidak mengandung protein. Keringat membawa air, garam, dan urea; glukosa direabsorpsi di tubulus proksimal. Paru-paru mengeluarkan CO₂ dan uap air, bukan urea.'},
{k:'Pencernaan',t:'bs',s:'Seorang anak SD mengalami diare akut setelah jajan es dan gorengan di pinggir jalan yang kurang higienis. Ia buang air besar cair berkali-kali, tampak lemas, mata cekung, dan bibir kering. Tentukan Benar atau Salah pada setiap pernyataan berikut!',o:['Feses yang cair menandakan air tidak sempat diserap kembali di usus besar sehingga tubuh kehilangan banyak cairan.','Dehidrasi berat membuat ginjal menghasilkan urine lebih banyak dan lebih encer untuk menjaga cairan tubuh.','Berkurangnya volume darah akibat dehidrasi dapat memicu denyut nadi meningkat.'],a:[true,false,true],e:'Diare mempercepat gerak usus sehingga penyerapan air berkurang. Saat dehidrasi, ginjal menahan air (urine sedikit dan pekat), bukan membuangnya. Volume darah turun sehingga jantung berdenyut lebih cepat untuk mempertahankan aliran darah.'},
{k:'Pernapasan',t:'bs',s:'Pak Darto (55 tahun), perokok berat selama 30 tahun, mengeluh batuk kronis dan mudah sesak saat berjalan. Dokter menduga emfisema (kerusakan dinding alveolus). Hasil pemeriksaan:'+tb(['Pemeriksaan','Hasil','Nilai normal'],[['Frekuensi napas','28 x/menit','12–20 x/menit'],['Saturasi oksigen','89%','≥ 95%'],['Denyut nadi','104 x/menit','60–100 x/menit']])+'Tentukan Benar atau Salah pada setiap pernyataan berikut!',o:['Asap rokok merusak silia sehingga lendir dan partikel sulit dibersihkan dari saluran napas.','Rusaknya dinding alveolus mengurangi luas permukaan pertukaran gas sehingga oksigen dalam darah dapat menurun.','Saturasi oksigen 89% menunjukkan hemoglobin mengikat oksigen lebih banyak daripada orang normal.'],a:[true,true,false],e:'Rokok merusak silia dan alveolus. Luas permukaan difusi yang berkurang menurunkan oksigen darah. Saturasi 89% berada di bawah normal (≥ 95%), artinya hemoglobin yang jenuh oksigen lebih sedikit; napas dan nadi naik sebagai kompensasi.'},
{k:'Peredaran Darah',t:'bs',s:'Bu Siti (50 tahun) gemar makan ikan asin dan mi instan serta jarang berolahraga. Tekanan darahnya 165/100 mmHg selama beberapa tahun terakhir. Tentukan Benar atau Salah pada setiap pernyataan berikut!',o:['Hipertensi menyebabkan ventrikel kanan menebal karena harus memompa darah ke seluruh tubuh.','Konsumsi garam berlebih dapat menahan air dalam tubuh sehingga volume darah meningkat.','Hipertensi jangka panjang dapat merusak pembuluh darah kecil di glomerulus sehingga fungsi filtrasi ginjal menurun.'],a:[false,true,true],e:'Beban hipertensi terutama dirasakan ventrikel kiri yang memompa darah ke seluruh tubuh, bukan ventrikel kanan. Natrium menahan air sehingga volume darah naik, dan tekanan tinggi merusak pembuluh darah ginjal sehingga laju filtrasi turun.'},
{k:'Ekskresi',t:'bs',s:'Pak Hasan menderita gagal ginjal kronis. Ia menjalani cuci darah (hemodialisis) dua kali seminggu, kakinya bengkak, dan kadar ureum darahnya tinggi. Tentukan Benar atau Salah pada setiap pernyataan berikut!',o:['Penurunan filtrasi glomerulus membuat ureum dan kreatinin menumpuk dalam darah.','Hemodialisis menggantikan fungsi paru-paru dalam membuang karbon dioksida.','Penumpukan cairan dapat menambah volume darah sehingga tekanan darah naik.'],a:[true,false,true],e:'Ginjal yang gagal tidak mampu menyaring ureum dan kreatinin, serta menahan cairan sehingga timbul bengkak dan tekanan darah naik. Hemodialisis menggantikan sebagian fungsi filtrasi ginjal, bukan fungsi paru-paru.'}
